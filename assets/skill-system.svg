<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="skillSystemTitle skillSystemDesc">
  <title id="skillSystemTitle">Flujo de una skill de Skills Chile</title>
  <desc id="skillSystemDesc">Diagrama de cinco etapas: problema chileno, SKILL.md, referencias, modelo y salida verificable.</desc>
  <defs>
    <linearGradient id="flowBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="flowAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="520" rx="32" fill="url(#flowBg)"/>
  <text x="70" y="82" fill="#f8fafc" font-size="36" font-family="Arial, Helvetica, sans-serif" font-weight="700">De problema chileno a respuesta verificable</text>
  <text x="70" y="120" fill="#94a3b8" font-size="20" font-family="Arial, Helvetica, sans-serif">Una skill no es un prompt largo: organiza criterio, evidencia y ejecución.</text>
  <rect x="70" y="148" width="1260" height="6" rx="3" fill="url(#flowAccent)"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(70 205)">
      <rect width="220" height="190" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#334155"/>
      <circle cx="46" cy="45" r="22" fill="#2563eb"/>
      <text x="39" y="53" fill="#fff" font-size="22" font-weight="700">1</text>
      <text x="28" y="92" fill="#fff" font-size="22" font-weight="700">Problema Chile</text>
      <text x="28" y="126" fill="#cbd5e1" font-size="17">Ley · trámite ·</text>
      <text x="28" y="151" fill="#cbd5e1" font-size="17">industria · proceso</text>
    </g>

    <path d="M305 300h55" stroke="#64748b" stroke-width="3"/>
    <path d="M350 292l12 8-12 8" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(375 205)">
      <rect width="220" height="190" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#334155"/>
      <circle cx="46" cy="45" r="22" fill="#0f766e"/>
      <text x="39" y="53" fill="#fff" font-size="22" font-weight="700">2</text>
      <text x="28" y="92" fill="#fff" font-size="22" font-weight="700">SKILL.md</text>
      <text x="28" y="126" fill="#cbd5e1" font-size="17">Cuándo usar</text>
      <text x="28" y="151" fill="#cbd5e1" font-size="17">y cómo actuar</text>
    </g>

    <path d="M610 300h55" stroke="#64748b" stroke-width="3"/>
    <path d="M655 292l12 8-12 8" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(680 205)">
      <rect width="220" height="190" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#334155"/>
      <circle cx="46" cy="45" r="22" fill="#7c3aed"/>
      <text x="39" y="53" fill="#fff" font-size="22" font-weight="700">3</text>
      <text x="28" y="92" fill="#fff" font-size="22" font-weight="700">Referencias</text>
      <text x="28" y="126" fill="#cbd5e1" font-size="17">Fuentes y detalle</text>
      <text x="28" y="151" fill="#cbd5e1" font-size="17">bajo demanda</text>
    </g>

    <path d="M915 300h55" stroke="#64748b" stroke-width="3"/>
    <path d="M960 292l12 8-12 8" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(985 205)">
      <rect width="220" height="190" rx="24" fill="#ffffff" fill-opacity="0.07" stroke="#334155"/>
      <circle cx="46" cy="45" r="22" fill="#d97706"/>
      <text x="39" y="53" fill="#fff" font-size="22" font-weight="700">4</text>
      <text x="28" y="92" fill="#fff" font-size="22" font-weight="700">Modelo IA</text>
      <text x="28" y="126" fill="#cbd5e1" font-size="17">GPT · Claude ·</text>
      <text x="28" y="151" fill="#cbd5e1" font-size="17">agentes compatibles</text>
    </g>

    <path d="M1220 300h45" stroke="#64748b" stroke-width="3"/>
    <path d="M1255 292l12 8-12 8" fill="none" stroke="#64748b" stroke-width="3"/>

    <g transform="translate(1280 233)">
      <circle cx="0" cy="67" r="47" fill="#dc2626" fill-opacity="0.18" stroke="#dc2626"/>
      <path d="M-18 67l12 12 27-31" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-50" y="142" fill="#f8fafc" font-size="17" font-weight="700">Verificable</text>
    </g>
  </g>

  <text x="70" y="470" fill="#64748b" font-size="17" font-family="Arial, Helvetica, sans-serif">Skills Chile · instrucciones compactas + referencias progresivas + validación automática</text>
</svg>
