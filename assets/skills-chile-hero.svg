<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Skills Chile</title>
  <desc id="desc">Hero SVG del repositorio Skills Chile con foco en skills chilenas y protección de datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1320" cy="170" r="190" fill="#2563eb" opacity="0.10"/>
  <circle cx="240" cy="780" r="230" fill="#dc2626" opacity="0.08"/>

  <g filter="url(#shadow)">
    <rect x="88" y="88" width="1424" height="724" rx="36" fill="url(#card)" stroke="rgba(255,255,255,0.12)"/>
  </g>

  <rect x="120" y="120" width="1360" height="12" rx="6" fill="url(#accent)"/>

  <g transform="translate(140 170)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#ffffff" opacity="0.10"/>
    <rect x="12" y="12" width="96" height="96" rx="20" fill="#ffffff"/>
    <rect x="12" y="12" width="48" height="48" fill="#0039a6"/>
    <path d="M36 23l4.9 14.8H56L43.6 46.9l4.8 14.7L36 52.7l-12.4 8.9 4.8-14.7L16 37.8h15.1z" fill="#ffffff"/>
    <rect x="12" y="60" width="96" height="48" fill="#d52b1e"/>
  </g>

  <text x="290" y="220" fill="#ffffff" font-size="64" font-family="Arial, Helvetica, sans-serif" font-weight="700">Skills Chile</text>
  <text x="292" y="270" fill="#cbd5e1" font-size="28" font-family="Arial, Helvetica, sans-serif">Repositorio de skills prácticas para GPT, Claude y asistentes con foco en Chile</text>

  <g transform="translate(290 330)">
    <rect x="0" y="0" width="290" height="54" rx="27" fill="#0f766e"/>
    <text x="28" y="35" fill="#ecfeff" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700">Primera skill disponible</text>
  </g>

  <g transform="translate(290 410)">
    <rect x="0" y="0" width="980" height="250" rx="28" fill="#ffffff" opacity="0.07"/>
    <text x="36" y="58" fill="#ffffff" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700">proteccion-datos-chile</text>
    <text x="36" y="102" fill="#dbeafe" font-size="24" font-family="Arial, Helvetica, sans-serif">Ley 19.628 + transición a Ley 21.719</text>
    <text x="36" y="148" fill="#e2e8f0" font-size="22" font-family="Arial, Helvetica, sans-serif">• Vigencia nuevo régimen: 01-DIC-2026</text>
    <text x="36" y="184" fill="#e2e8f0" font-size="22" font-family="Arial, Helvetica, sans-serif">• Pensada para cumplimiento, software, políticas y auditoría</text>
    <text x="36" y="220" fill="#e2e8f0" font-size="22" font-family="Arial, Helvetica, sans-serif">• Lista para crecer con más skills chilenas</text>
  </g>

  <g transform="translate(1160 330)">
    <rect x="0" y="0" width="256" height="72" rx="20" fill="#ffffff" opacity="0.10"/>
    <text x="28" y="32" fill="#bfdbfe" font-size="20" font-family="Arial, Helvetica, sans-serif">Nueva ley de datos</text>
    <text x="28" y="58" fill="#ffffff" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">01-DIC-2026</text>
  </g>

  <g transform="translate(1160 426)">
    <rect x="0" y="0" width="256" height="72" rx="20" fill="#ffffff" opacity="0.10"/>
    <text x="28" y="32" fill="#fecaca" font-size="20" font-family="Arial, Helvetica, sans-serif">Foco del repo</text>
    <text x="28" y="58" fill="#ffffff" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Skills para Chile</text>
  </g>

  <g transform="translate(1160 522)">
    <rect x="0" y="0" width="256" height="72" rx="20" fill="#ffffff" opacity="0.10"/>
    <text x="28" y="32" fill="#a7f3d0" font-size="20" font-family="Arial, Helvetica, sans-serif">Objetivo</text>
    <text x="28" y="58" fill="#ffffff" font-size="28" font-family="Arial, Helvetica, sans-serif" font-weight="700">Simple y útil</text>
  </g>

  <text x="120" y="782" fill="#94a3b8" font-size="18" font-family="Arial, Helvetica, sans-serif">Skills Chile · primera colección enfocada en problemas, normas y procesos reales de Chile</text>
</svg>
